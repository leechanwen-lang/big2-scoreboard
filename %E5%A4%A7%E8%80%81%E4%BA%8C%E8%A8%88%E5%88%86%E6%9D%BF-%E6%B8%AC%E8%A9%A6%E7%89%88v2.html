<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>誰羽橋社｜大老二計分板</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#182333;background:#f3f6fa}body{margin:0;padding:12px}main{max-width:900px;margin:auto}h2{text-align:center;margin:8px 0 16px}.panel{background:white;border-radius:12px;padding:12px;margin:10px 0;box-shadow:0 1px 6px #0001}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}button,select{font:inherit;padding:10px;border:1px solid #a8b5c4;border-radius:8px;background:white}button.primary{background:#145aa0;color:white;border:0}button.danger{color:#a02c27}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;table-layout:fixed;min-width:390px}th,td{border:1px solid #d4dce5;padding:7px 2px;text-align:center;font-size:14px}th:first-child,td:first-child{width:64px;background:#edf3f9;font-weight:650}input.name{width:95%;box-sizing:border-box;text-align:center;border:1px solid #ccd5e0;border-radius:4px;font-size:14px;padding:7px 0}input.score{width:90%;box-sizing:border-box;text-align:center;border:1px solid #aabbd0;border-radius:5px;background:#fff;font-size:18px;padding:9px 0}input.score:focus{outline:2px solid #2174c2;background:#eef7ff}.total{background:#e7f5ec;font-weight:bold}.muted{color:#637286;font-size:13px}.keyboard{position:fixed;bottom:0;left:0;right:0;background:#e8eef5;border-top:1px solid #a9b9ca;padding:10px max(10px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom));z-index:20;box-shadow:0 -3px 14px #0002}.keyboard[hidden]{display:none}.keys{max-width:420px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.keys button{font-size:22px;background:white;padding:13px}.keys button.action{font-size:16px;background:#d4e4f3}.kbdhead{max-width:420px;margin:0 auto 8px;display:flex;justify-content:space-between;align-items:center}.status{min-height:20px;color:#245b85}body.kbdopen{padding-bottom:320px}</style></head><body><main><h2>🃏 誰羽橋社｜大老二計分板</h2><section class="panel"><div class="controls"><label>人數 <select id="count"><option>4</option><option>5</option><option>6</option><option>7</option></select></label><span class="muted">最多20局｜手指點格輸入</span></div></section><section class="panel scroll"><table id="entry"><tr><th>項目</th><th>玩家1</th><th>玩家2</th><th>玩家3</th><th>玩家4</th></tr><tr><td>名次</td><td>待啟用</td><td>待啟用</td><td>待啟用</td><td>待啟用</td></tr><tr><td>得分</td><td></td><td></td><td></td><td></td></tr><tr><td>扣分</td><td>待啟用</td><td>待啟用</td><td>待啟用</td><td>待啟用</td></tr><tr><td>加分</td><td></td><td></td><td></td><td></td></tr><tr><td>本局合計</td><td></td><td></td><td></td><td></td></tr></table><p id="status" class="status" aria-live="polite">若顯示「待啟用」，代表目前開啟方式未執行程式，請在 Safari 開啟正式網頁。</p><div class="controls"><button class="primary" id="save">完成本局</button><button id="clear">清除本局輸入</button><button class="danger" id="reset">開始新場</button></div></section><section class="panel scroll"><strong>每局成績與累計</strong><table id="history"><tr><th>局數</th><th>玩家1</th><th>玩家2</th><th>玩家3</th><th>玩家4</th></tr><tr><td>累計</td><td>0</td><td>0</td><td>0</td><td>0</td></tr></table></section><p class="muted">測試版：資料僅保存在目前瀏覽器內，不會上傳雲端。請勿使用無痕模式。</p></main><div class="keyboard" id="keyboard" hidden><div class="kbdhead"><strong id="keylabel">輸入數字</strong><button id="closekey">收起鍵盤</button></div><div class="keys" id="keys"></div></div><script>
(()=>{'use strict';const KEY='big2-score-v1';let state={count:4,names:Array.from({length:7},(_,i)=>`玩家${i+1}`),ranks:Array(7).fill(''),penalties:Array(7).fill(''),rounds:[]};try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Number.isInteger(x.count)&&x.count>=4&&x.count<=7&&Array.isArray(x.rounds))state={...state,...x}}catch(e){}const $=id=>document.getElementById(id);let active=null;function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){$('status').textContent='瀏覽器無法儲存資料，請注意不要關閉頁面。'}}function escape(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function calc(){const n=state.count,r=state.ranks.slice(0,n).map(Number),p=state.penalties.slice(0,n).map(v=>v===''?0:Number(v));const valid=state.ranks.slice(0,n).every(v=>v!==''&&Number.isInteger(Number(v))&&Number(v)>=1&&Number(v)<=n)&&new Set(r).size===n;const winner=valid?r.indexOf(1):-1;const earned=valid?r.map(v=>n-v+1):Array(n).fill(null);const bonus=Array(n).fill(null);if(winner>=0)bonus[winner]=p.reduce((a,b)=>a+b,0);const totals=valid?earned.map((v,i)=>v-p[i]+(bonus[i]||0)):Array(n).fill(null);return {valid,winner,earned,p,bonus,totals}}function render(){const n=state.count,c=calc();$('count').value=n;let h='<tr><th>項目</th>'+Array.from({length:n},(_,i)=>`<th><input class="name" data-name="${i}" value="${escape(state.names[i])}" maxlength="16" aria-label="玩家${i+1}姓名"></th>`).join('')+'</tr>';for(const [label,type] of [['名次','ranks'],['得分','earned'],['扣分','penalties'],['加分','bonus'],['本局合計','totals']]){h+=`<tr class="${type==='totals'?'total':''}"><td>${label}</td>`;for(let i=0;i<n;i++){if(type==='ranks'||type==='penalties')h+=`<td><input class="score" readonly inputmode="none" data-type="${type}" data-i="${i}" value="${escape(state[type][i])}" aria-label="${state.names[i]}${label}"></td>`;else h+=`<td>${c[type][i]===null?'':c[type][i]}</td>`}h+='</tr>'}$('entry').innerHTML=h;let t='<tr><th>局數</th>'+state.names.slice(0,n).map(x=>`<th>${escape(x)}</th>`).join('')+'</tr>';state.rounds.forEach((round,j)=>{t+=`<tr><td>${j+1}</td>${round.totals.map(x=>`<td>${x}</td>`).join('')}</tr>`});const sums=Array.from({length:n},(_,i)=>state.rounds.reduce((s,r)=>s+(Number(r.totals[i])||0),0));t+=`<tr class="total"><td>累計</td>${sums.map(v=>`<td>${v}</td>`).join('')}</tr>`;$('history').innerHTML=t;$('status').textContent=`已記錄 ${state.rounds.length} / 20 局${c.valid?'｜本局合計 '+c.totals.reduce((a,b)=>a+b,0)+' 分':'｜請輸入完整且不重複的名次'}`;$('save').disabled=state.rounds.length>=20}function close(){active=null;$('keyboard').hidden=true;document.body.classList.remove('kbdopen')}function openKey(el){active={type:el.dataset.type,i:Number(el.dataset.i)};$('keylabel').textContent=`${state.names[active.i]}｜${active.type==='ranks'?'名次':'扣分'}`;$('keyboard').hidden=false;document.body.classList.add('kbdopen');el.focus()}function key(v){if(!active)return;const {type,i}=active;let s=String(state[type][i]??'');if(v==='C')s='';else if(v==='←')s=s.slice(0,-1);else if(v==='−'){if(type==='penalties')s=s.startsWith('-')?s.slice(1):'-'+s}else if(/^\d$/.test(v)){if(s.replace('-','').length<5)s+=v}state[type][i]=s;persist();render();const el=document.querySelector(`[data-type="${type}"][data-i="${i}"]`);if(el)el.focus()}$('entry').addEventListener('click',e=>{if(e.target.matches('input.score'))openKey(e.target)});$('entry').addEventListener('input',e=>{if(e.target.matches('[data-name]')){state.names[Number(e.target.dataset.name)]=e.target.value;persist();$('history').querySelectorAll('th').forEach((th,i)=>{if(i>0)th.textContent=state.names[i-1]})}});$('count').addEventListener('change',e=>{const n=Number(e.target.value);if(state.rounds.length&&!confirm('切換人數會清除已記錄的局數，確定嗎？')){e.target.value=state.count;return}state.count=n;state.rounds=[];state.ranks=Array(7).fill('');state.penalties=Array(7).fill('');close();persist();render()});$('save').onclick=()=>{const c=calc();if(!c.valid){alert('請先輸入1至'+state.count+'名，且每個名次只能出現一次。');return}if(state.penalties.slice(0,state.count).some(v=>v!==''&&(!/^-?\d+$/.test(v)||!Number.isSafeInteger(Number(v))))){alert('扣分請輸入整數。');return}if(state.rounds.length>=20)return;if(!confirm('確認將第'+(state.rounds.length+1)+'局成績加入紀錄？'))return;state.rounds.push({totals:c.totals.slice(),ranks:state.ranks.slice(0,state.count),penalties:state.penalties.slice(0,state.count)});state.ranks=Array(7).fill('');state.penalties=Array(7).fill('');close();persist();render()};$('clear').onclick=()=>{if(!confirm('清除目前尚未儲存的名次及扣分？'))return;state.ranks=Array(7).fill('');state.penalties=Array(7).fill('');close();persist();render()};$('reset').onclick=()=>{if(!confirm('確定開始新場？目前全部局數紀錄將清除！'))return;if(!confirm('再次確認：刪除全部舊成績？'))return;state.rounds=[];state.ranks=Array(7).fill('');state.penalties=Array(7).fill('');close();persist();render()};$('closekey').onclick=close;for(const v of ['1','2','3','4','5','6','7','8','9','−','0','←','C','完成']){const b=document.createElement('button');b.textContent=v;b.className=v==='完成'||v==='C'||v==='←'?'action':'';if(v==='完成')b.style.gridColumn='span 2';b.onclick=()=>v==='完成'?close():key(v);$('keys').appendChild(b)}render()})();
</script></body></html>
